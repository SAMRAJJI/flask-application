{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='style/blogs.css') }}">

<div class="add-blog-container">
  <div class="add-blog-card">
    <div class="add-blog-header">
      <h2>✏️ Create New Post</h2>
      <p>Share your thoughts with the community</p>
    </div>

    <form method="POST" class="add-blog-form">
      <div class="form-group">
        <label for="title">Post Title</label>
        <input type="text" id="title" name="title" placeholder="What's your post about?" required>
      </div>

      <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" placeholder="Write your amazing content here..." required></textarea>
      </div>

      <button type="submit" class="publish-btn">🚀 Publish Post</button>
    </form>
  </div>
</div>

{% endblock %}
